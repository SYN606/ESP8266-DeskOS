; PlatformIO Project Configuration File for ESP32 DeskOS
;
; Target environment configuration
; Default is set to nodemcuv2 (ESP8266) to match the connected hardware,
; with esp32dev preserved for ESP32 boards.

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    olikraus/U8g2@^2.35.19
    bblanchon/ArduinoJson@^7.0.4

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200

lib_deps =
    olikraus/U8g2@^2.35.19
    bblanchon/ArduinoJson@^7.0.4
